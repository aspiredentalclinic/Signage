<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aspire Dental Signage</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        .video-container { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body>
    <div class="video-container">
        <video autoplay muted playsinline preload="auto" id="player"></video>
    </div>
    <script>
        const player = document.getElementById('player');
        let index = 0;

        fetch('videos.json')
            .then(r => r.json())
            .then(videos => {
                function play() {
                    player.src = videos[index];
                    player.play().catch(() => {
                        player.muted = true;
                        player.play();
                    });
                }
                player.addEventListener('ended', () => {
                    index = (index + 1) % videos.length;
                    play();
                });
                play();
            });
    </script>
</body>
</html>
