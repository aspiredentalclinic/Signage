<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aspire Dental Signage</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        video { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; }
    </style>
</head>
<body>
    <video id="player" autoplay muted playsinline></video>
    <script>
        const player = document.getElementById('player');
        let index = 0;

        fetch('videos.json')
            .then(r => r.json())
            .then(async (videos) => {
                if (videos && videos.length > 0) {
                    player.addEventListener('ended', () => {
                        index = (index + 1) % videos.length;
                        player.src = videos[index];
                        // Explicitly calling play() is more robust across browsers
                        player.play().catch(error => console.error("Playback failed:", error));
                    });

                    // Set initial video and start playback programmatically
                    player.src = videos[index];
                    await player.play().catch(error => console.error("Initial playback failed:", error));
                } else {
                    console.error("No videos found in videos.json");
                }
            })
            .catch(error => {
                console.error("Error fetching or parsing videos.json:", error);
            });
    </script>
</body>
</html>
